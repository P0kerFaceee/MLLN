<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLLN - 工业仓库物流识别系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/web/static/css/app.css">
</head>
<body>
    <div id="app">
        <div class="scan-overlay" v-if="isScanning"></div>
        <header class="sys-header">
            <div class="header-brand">
                <div class="brand-icon">
                    <svg width="28" height="28" viewBox="0 0 28 28"><rect x="2" y="2" width="8" height="8" fill="var(--accent)" rx="1"/><rect x="12" y="2" width="8" height="8" fill="var(--primary)" rx="1"/><rect x="22" y="2" width="4" height="8" fill="var(--text-muted)" rx="1"/><rect x="2" y="12" width="14" height="4" fill="var(--primary)" rx="1"/><rect x="18" y="12" width="8" height="4" fill="var(--accent)" rx="1"/><rect x="2" y="18" width="24" height="8" fill="var(--text-secondary)" rx="1"/></svg>
                </div>
                <div class="brand-text">
                    <span class="brand-name">MLLN</span>
                    <span class="brand-sub">工业仓库物流识别</span>
                </div>
            </div>
            <nav class="header-nav">
                <router-link to="/learn" class="nav-link" :class="{ active: $route.path === '/learn' }">
                    <span class="nav-icon">◈</span> 学习端
                </router-link>
                <router-link to="/search" class="nav-link" :class="{ active: $route.path === '/search' }">
                    <span class="nav-icon">◉</span> 使用端
                </router-link>
            </nav>
            <div class="header-status">
                <div class="status-item">
                    <span class="status-label">DB</span>
                    <span class="status-value">{{ dbCount }}</span>
                </div>
                <div class="status-dot" :class="{ online: systemOnline }"></div>
            </div>
        </header>
        <main class="sys-main">
            <router-view></router-view>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-router@3.6.5/dist/vue-router.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
    <script src="/web/static/js/app.js"></script>
</body>
</html>
